[project]
name = "diversity-and-inclusion-wg"
version = "0.1.0"
description = "Website for the Python Software Foundation's Diversity & Inclusion Workgroup"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "markdown>=3.10.2",
    "pelican>=4.12.0",
]

[project.urls]
Homepage = "https://diversity.python.org"
Repository = "https://github.com/psf/diversity-and-inclusion-wg"

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]

[tool.uv]
# No importable package here (pelicanconf.py / theme / content), just a uv-managed
# environment for the Pelican build tooling.
package = false
# Guards against supply-chain attacks that publish a malicious release and get it
# installed within hours.
exclude-newer = "1 day"

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501", # line length: site copy (beliefs, values, member bios) legitimately runs long
]

[tool.ruff.lint.per-file-ignores]
# publishconf.py re-exports everything from pelicanconf.py; that's Pelican's own convention.
"publishconf.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
