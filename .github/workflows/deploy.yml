name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gh-pages push below does not use these credentials: actions-gh-pages builds its
          # own authenticated remote from the github_token input. Nothing else here needs git
          # write access, so the token has no reason to sit in .git/config for the whole job.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked

      - name: Build Tailwind CSS
        run: ./scripts/install-tailwindcss.sh && .bin/tailwindcss -i theme/tailwind.input.css -o theme/static/css/tailwind.css --minify

      - name: Build site
        run: uv run --locked pelican content -o output -s publishconf.py

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: output/
          publish_branch: gh-pages
          # The action replaces the whole branch with publish_dir on every deploy. Without this,
          # the custom domain's CNAME file (not part of the Pelican build) would be deleted on the
          # next push to main.
          cname: diversity.python.org
