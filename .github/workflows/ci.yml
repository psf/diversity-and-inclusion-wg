name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# A PR branch runs under both triggers; cancel the superseded run instead of paying for it twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dev dependencies
        run: uv sync --locked --group dev

      - name: ruff check
        run: uv run --locked ruff check --output-format=github .

      - name: ruff format
        run: uv run --locked ruff format --check .

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked

      - name: Build Tailwind CSS
        run: ./scripts/install-tailwindcss.sh && .bin/tailwindcss -i theme/tailwind.input.css -o theme/static/css/tailwind.css --minify

      # Smoke-tests templates, pelicanconf.py, and every members/*.json file: a broken one fails
      # the build here instead of on the next push to main.
      - name: Build site (production config)
        run: uv run --locked pelican content -o output -s publishconf.py
