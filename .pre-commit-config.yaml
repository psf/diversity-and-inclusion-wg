repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm # GitHub Flavored Markdown support
          # Preserves ---/+++-delimited frontmatter, including content/pages/*.md's Pelican
          # metadata header: python-markdown's Meta extension accepts an optional leading `---`
          # fence (and a closing `---`/`...`), so fencing it is safe and lets mdformat touch it.
          - mdformat-frontmatter

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.1
    hooks:
      - id: cspell # Spell check changed files
      - id: cspell # Spell check the commit message
        name: check commit message spelling
        args:
          - --no-must-find-files
          - --no-progress
          - --no-summary
          - --files
          - .git/COMMIT_EDITMSG
        stages: [commit-msg]
        always_run: true

  # Lints GitHub Actions workflow YAML (shellcheck on run: steps, unpinned actions, etc.).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Renovate config validator. Catches a typo in renovate.json5 before it silently breaks updates.
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.24.0
    hooks:
      - id: renovate-config-validator
        args: [--strict]
