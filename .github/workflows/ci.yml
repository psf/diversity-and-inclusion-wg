name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# A PR branch runs under both triggers; cancel the superseded run instead of paying for it twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ hashFiles('.pre-commit-config.yaml') }}
          # Falls back to a stale cache (e.g. Renovate bumping one hook rev) so only the
          # changed hook's environment needs to be rebuilt, not all of them.
          restore-keys: prek-

      - name: Install prek
        run: uv tool install prek

      # Runs every hook from .pre-commit-config.yaml (ruff, mdformat, cspell, actionlint,
      # renovate-config-validator, basic hygiene checks). Contributors who haven't run
      # `prek install` locally still get the same checks here.
      - name: Run pre-commit hooks
        run: prek run --all-files

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked

      - name: Build Tailwind CSS
        run: ./scripts/install-tailwindcss.sh && .bin/tailwindcss -i theme/tailwind.input.css -o theme/static/css/tailwind.css --minify

      # Smoke-tests templates, pelicanconf.py, and every members/*.json file: a broken one fails
      # the build here instead of on the next push to main.
      - name: Build site (production config)
        run: uv run --locked pelican content -o output -s publishconf.py
